<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription & Paiement Mobile Money</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #38bdf8;
        }
        .operators {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .operator-card {
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .operator-card.mvola { color: #facc15; border-color: #eab308; }
        .operator-card.orange { color: #fb923c; border-color: #f97316; }
        .operator-card.airtel { color: #f87171; border-color: #ef4444; }
        
        .operator-card.selected {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        .note {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 15px;
        }
        
        /* Fizarana ho an'ny Pejy Manaraka (Dashboard) */
        .hidden {
            display: none;
        }
        .dashboard {
            text-align: center;
        }
        .welcome-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .card-info {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .card-info h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .card-info .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #22c55e;
        }
        .card-info .bonus {
            font-size: 1.8rem;
            font-weight: bold;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PEJY 1: FISORATANA ANARANA -->
        <div id="registerSection">
            <h2>Inscription & Accès</h2>
            <form id="signupForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="fullname">Anarana sy Fanampiny (Nom)</label>
                    <input type="text" id="fullname" required placeholder="Ohatra: Hasambarana">
                </div>

                <div class="form-group">
                    <label for="email">Mailaka (Email)</label>
                    <input type="email" id="email" required placeholder="oh@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">Teny miafina (Mot de passe)</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>Safidio ny Mobile Money</label>
                    <div class="operators">
                        <div class="operator-card mvola" onclick="selectOperator('MVola', this)">MVola</div>
                        <div class="operator-card orange" onclick="selectOperator('Orange', this)">Orange Money</div>
                        <div class="operator-card airtel" onclick="selectOperator('Airtel', this)">Airtel Money</div>
                    </div>
                    <input type="hidden" id="selectedOperator" required>
                </div>

                <div class="form-group">
                    <label for="phone">Laharana finday handefasana ny vola</label>
                    <input type="tel" id="phone" required placeholder="034 00 000 00">
                </div>

                <button type="submit">Hisoratra anarana sy Handoa</button>
            </form>
            <div class="note" id="statusMessage">Aoka ho azo antoka fa marina ny laharanao.</div>
        </div>

        <!-- PEJY 2: TAFAFIDITRA (DASHBOARD) -->
        <div id="dashboardSection" class="hidden dashboard">
            <h2 class="welcome-title">Mba tafiditra soa aman-tsara ianao, <span id="displayName" style="color: white;"></span> !</h2>
            
            <div class="card-info">
                <h3>Solde misy anao</h3>
                <div class="amount">0 Ar</div>
            </div>

            <div class="card-info">
                <h3>Bonus Fisoratana Anarana</h3>
                <div class="bonus">2 000 Ar</div>
            </div>

            <button onclick="logout()">Hivoaka (Déconnexion)</button>
        </div>
    </div>

    <script>
        let chosenOperator = '';

        function selectOperator(operator, element) {
            document.querySelectorAll('.operator-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            chosenOperator = operator;
            document.getElementById('selectedOperator').value = operator;
        }

        function handleSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            
            if (!chosenOperator) {
                alert("Safidio azafady ny Mpandray Mobile Money (MVola, Orange na Airtel).");
                return;
            }

            // Asehoy ny anarana ao amin'ny pejy manaraka
            document.getElementById('displayName').innerText = name;

            // Afeno ny pejy fisoratana anarana ary asehoy ny dashboard
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function logout() {
            // Miverina amin'ny pejy voalohany
            document.getElementById('signupForm').reset();
            document.querySelectorAll('.operator-card').forEach(card => card.classList.remove('selected'));
            chosenOperator = '';
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
