<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADAPRO Social - Reseau Social</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .screen {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Fil d'actualité / Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 15px;
        }
        .post-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .post-author {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .post-content {
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-bottom: 10px;
        }
        .post-actions {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
        }
        .post-actions span:hover { color: #38bdf8; }
        
        /* Navbar bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 0.75rem;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- PEJY 1: FISORATANA ANARANA -->
        <div id="authScreen" class="screen">
            <h2>MADAPRO Social</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Anarana (Nom d'utilisateur)</label>
                    <input type="text" id="username" required placeholder="Ohatra: Hasam">
                </div>
                <div class="form-group">
                    <label>Teny miafina (Mot de passe)</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit">Miditra / Hisoratra anarana</button>
            </form>
        </div>

        <!-- PEJY 2: FIL D'ACTUALITÉ (ACCUEIL) -->
        <div id="feedScreen" class="screen hidden" style="padding-bottom: 80px;">
            <div class="feed-header">
                <h3>📢 Hafatra & Vaovao</h3>
                <button style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="logout()">Hivoaka</button>
            </div>

            <!-- Fanaovana Post Vaovao -->
            <div class="post-box">
                <label style="margin-bottom: 8px;">Inona no ao an-tsainao androany?</label>
                <textarea id="postText" rows="3" placeholder="Soraty eto ny hevitrao..."></textarea>
                <button onclick="createPost()">Mamoaka (Publier)</button>
            </div>

            <!-- Lisitry ny Post -->
            <div id="postsContainer">
                <div class="post-box">
                    <div class="post-author">Admin Madapro</div>
                    <div class="post-content">Tongasoa eto amin'ny tambajotra sosialy vaovao ho an'i Madagasikara! Afaka mizara hevitra eto ianao.</div>
                    <div class="post-actions">
                        <span>❤️ 12 Jereo</span>
                        <span>💬 3 Hevitra</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- PEJY 3: PROFILE / FITAOVANA -->
        <div id="profileScreen" class="screen hidden" style="padding-bottom: 80px;">
            <h2>👤 Mombamomba Anao</h2>
            <div class="post-box">
                <p><strong>Anarana:</strong> <span id="profileName">Hasam</span></p>
                <p style="margin-top: 8px;"><strong>ID:</strong> MDP884210</p>
                <p style="margin-top: 8px;"><strong>Statut:</strong> Mpikambana Mavitrika</p>
            </div>
            <button onclick="alert('Vonona ny hanao téléchargement (APK/PWA) amin\'ny manaraka!')">📥 Ampakatra App (Installer)</button>
        </div>

        <!-- NAVBAR BAS -->
        <div class="bottom-nav hidden" id="bottomNav">
            <div class="nav-item active" id="navHome" onclick="switchTab('feed')">
                <span>🏠</span>
                <span>Accueil</span>
            </div>
            <div class="nav-item" id="navProfile" onclick="switchTab('profile')">
                <span>👤</span>
                <span>Profil</span>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";

        function handleLogin(event) {
            event.preventDefault();
            currentUser = document.getElementById('username').value;
            if(!currentUser) return;

            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('feedScreen').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');
            document.getElementById('profileName').innerText = currentUser;
        }

        function createPost() {
            const text = document.getElementById('postText').value;
            if(!text.trim()) return;

            const container = document.getElementById('postsContainer');
            const newPost = document.createElement('div');
            newPost.className = 'post-box';
            newPost.innerHTML = `
                <div class="post-author">${currentUser}</div>
                <div class="post-content">${text}</div>
                <div class="post-actions">
                    <span>❤️ 0 Jereo</span>
                    <span>💬 0 Hevitra</span>
                </div>
            `;
            container.prepend(newPost);
            document.getElementById('postText').value = '';
        }

        function switchTab(tab) {
            if(tab === 'feed') {
                document.getElementById('feedScreen').classList.remove('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
                document.getElementById('navHome').classList.add('active');
                document.getElementById('navProfile').classList.remove('active');
            } else {
                document.getElementById('profileScreen').classList.remove('hidden');
                document.getElementById('feedScreen').classList.add('hidden');
                document.getElementById('navProfile').classList.add('active');
                document.getElementById('navHome').classList.remove('active');
            }
        }

        function logout() {
            currentUser = "";
            document.getElementById('feedScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('bottomNav').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
